role: Lectora Sénior y Co-Directora Interina del Programa de Español
bio: |
  Lectora Sénior de Español y Portugués y Co-Directora Interina del Programa de Español en Princeton University. Se especializa en sintaxis, con investigaciones sobre la estructura focalizadora Ser, la prosodia en las peticiones, el orden de palabras en español, la variación sociolingüística en los tiempos de futuro y los marcadores del discurso.
