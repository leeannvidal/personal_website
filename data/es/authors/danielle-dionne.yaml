role: Científica del Aprendizaje Sénior
bio: |
  Científica del Aprendizaje Sénior en Duolingo, donde también escribe para el [Blog de Duolingo](https://blog.duolingo.com/author/danielle/). Obtuvo su doctorado en Lingüística en Boston University, especializándose en sociolingüística y variación lingüística.
