bio: |
  Científica del lenguaje (PhD, Boston University) que une la investigación sociolingüística y la IA, con experiencia en evaluación de modelos, curación de conjuntos de datos y ciencia de datos aplicada.

interests:
  - Lenguaje, Datos y Sociedad
  - Investigación Lingüística Basada en Datos
  - Automatización de Flujos de Trabajo y Eficiencia
  - Ética de IA y Tecnología Responsable
  - Liderazgo de Equipos y Transferencia de Conocimiento

