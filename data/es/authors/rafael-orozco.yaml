role: Profesor de Lingüística y Español, Presidente del Departamento de Lenguas, Literaturas y Culturas del Mundo en Louisiana State University
bio: |
  Rafael Orozco es Profesor de Lingüística y Español y Presidente del Departamento de Lenguas, Literaturas y Culturas del Mundo en Louisiana State University. Su investigación se centra en la sociolingüística, el español colombiano y caribeño, el español en los Estados Unidos, el contacto lingüístico, la lingüística forense y el multilingüismo.
